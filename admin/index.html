<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华中商贸配送中心 · 管理后台</title>
<style>
:root{
  --brand:#C93B32; --brand-dark:#A62B24; --brand-light:#FDF0EE; --brand-line:#F3D6D2;
  --ok:#15A05A; --ok-light:#E8F6EE;
  --warn:#D98A18; --warn-light:#FDF4E4;
  --danger:#D64040; --danger-light:#FCEEEE;
  --info:#2563A8; --info-light:#EAF2FB;
  --text-1:#1F2226; --text-2:#5B6169; --text-3:#9AA0A6;
  --line:#E7EAEE; --bg:#F4F6F8; --sidebar:#FFFFFF;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text-1);font-size:13px;
  display:flex;flex-direction:column;
}
button{font-family:inherit;}
/* ---------- topbar ---------- */
.topbar{
  height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;flex-shrink:0;z-index:20;
}
.topbar .logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;flex:1;}
.topbar .logo .mk{
  width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;letter-spacing:.5px;
}
.topbar .logo span.sub{font-size:12px;color:var(--text-3);font-weight:400;margin-left:2px;}
.topbar .who{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--text-2);}
.topbar .who .av{width:28px;height:28px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:12px;}
/* ---------- layout ---------- */
.body{flex:1;display:flex;min-height:0;}
.sidebar{
  width:212px;background:var(--sidebar);border-right:1px solid var(--line);flex-shrink:0;
  padding:12px 10px;overflow-y:auto;
}
.nav-group{font-size:11px;color:var(--text-3);padding:10px 10px 6px;letter-spacing:.5px;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;
  color:var(--text-2);font-size:13.5px;margin-bottom:2px;user-select:none;
}
.nav-item:hover{background:#F5F6F8;color:var(--text-1);}
.nav-item.on{background:var(--brand-light);color:var(--brand);font-weight:500;}
.nav-item .badge{
  margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;padding:1px 6px;border-radius:9px;
  line-height:1.6;font-weight:400;
}
.nav-item.on .badge{background:var(--brand);}
.main{flex:1;overflow-y:auto;padding:18px 22px 40px;min-width:0;}
/* ---------- page head ---------- */
.phead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
.phead h2{margin:0 0 4px;font-size:17px;font-weight:500;}
.phead p{margin:0;font-size:12.5px;color:var(--text-3);}
.phead .acts{display:flex;gap:9px;flex-wrap:wrap;}
/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--brand);background:var(--brand);color:#fff;font-size:13px;padding:8px 15px;
  border-radius:8px;cursor:pointer;line-height:1.4;white-space:nowrap;
}
.btn:hover{opacity:.9;}
.btn.sec{background:#fff;color:var(--text-2);border-color:#DDE1E6;}
.btn.sec:hover{border-color:var(--brand);color:var(--brand);opacity:1;}
.btn.ghost{background:#fff;color:var(--brand);border-color:var(--brand-line);}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn[disabled]{background:#EBEDF0;border-color:#EBEDF0;color:#A8AEB5;cursor:not-allowed;}
.link{color:var(--brand);cursor:pointer;font-size:12.5px;}
.link:hover{text-decoration:underline;}
.link.danger{color:var(--danger);}
.link.muted{color:var(--text-3);cursor:default;}
/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;}
.card-hd h3{margin:0;font-size:14px;font-weight:500;}
.card-hd .hint{font-size:12px;color:var(--text-3);}
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}.g2{grid-template-columns:1fr;}}
/* ---------- stat ---------- */
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;}
.stat .lb{font-size:12.5px;color:var(--text-3);margin-bottom:9px;display:flex;align-items:center;gap:6px;}
.stat .vl{font-size:25px;font-weight:500;line-height:1;letter-spacing:-.5px;}
.stat .vl small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:4px;letter-spacing:0;}
.stat .ft{font-size:11.5px;color:var(--text-3);margin-top:8px;}
.stat.accent{background:var(--brand);border-color:var(--brand);}
.stat.accent .lb,.stat.accent .ft{color:rgba(255,255,255,.82);}
.stat.accent .vl{color:#fff;}
.stat.danger{background:var(--danger-light);border-color:#F5CFCF;}
.stat.danger .vl{color:var(--danger);}
/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;}
table.tbl th{
  text-align:left;font-weight:400;color:var(--text-3);font-size:12px;padding:10px 12px;
  background:#FAFBFC;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:11px 12px;border-bottom:1px solid #F2F4F6;vertical-align:middle;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl tbody tr:hover{background:#FCFCFD;}
table.tbl td.nowrap,table.tbl th.nowrap{white-space:nowrap;}
table.tbl .num{font-variant-numeric:tabular-nums;}
.empty{padding:46px;text-align:center;color:var(--text-3);font-size:13px;}
/* ---------- tag ---------- */
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;line-height:1.6;white-space:nowrap;}
.t-gray{background:#F1F3F5;color:#6B7178;}
.t-brand{background:var(--brand-light);color:var(--brand);}
.t-ok{background:var(--ok-light);color:var(--ok);}
.t-warn{background:var(--warn-light);color:var(--warn);}
.t-danger{background:var(--danger-light);color:var(--danger);}
.t-info{background:var(--info-light);color:var(--info);}
/* ---------- filters ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.filters input,.filters select{
  font-size:13px;padding:8px 11px;border:1px solid #DDE1E6;border-radius:8px;background:#fff;
  color:var(--text-1);outline:none;font-family:inherit;min-width:130px;
}
.filters input:focus,.filters select:focus{border-color:var(--brand-line);}
.filters input.search{min-width:210px;}
.filters .sp{flex:1;}
/* ---------- bars ---------- */
.bar-row{display:flex;align-items:center;gap:11px;margin-bottom:11px;font-size:12.5px;}
.bar-row .nm{width:96px;color:var(--text-2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .bar{flex:1;height:8px;background:#F1F3F5;border-radius:5px;overflow:hidden;}
.bar-row .bar i{display:block;height:100%;border-radius:5px;background:var(--brand);}
.bar-row .vl{width:74px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;flex-shrink:0;}
.bar-row .vl b{color:var(--text-1);font-weight:500;}
/* ---------- progress seg ---------- */
.seg{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#F1F3F5;margin:4px 0 12px;}
.seg i{display:block;height:100%;}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text-2);}
.legend span{display:flex;align-items:center;gap:6px;}
.legend i{width:9px;height:9px;border-radius:3px;display:block;}
/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:10px;height:132px;padding-top:8px;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;}
.chart .col .bar{width:100%;max-width:46px;background:var(--brand);border-radius:5px 5px 0 0;min-height:3px;position:relative;}
.chart .col .bar span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-2);}
.chart .col .lb{font-size:11.5px;color:var(--text-3);}
/* ---------- modal ---------- */
.mask{
  position:fixed;inset:0;background:rgba(24,28,34,.42);display:none;align-items:center;justify-content:center;
  z-index:100;padding:24px;
}
.mask.show{display:flex;}
.modal{
  background:#fff;border-radius:12px;width:640px;max-width:100%;max-height:86vh;display:flex;flex-direction:column;
  overflow:hidden;
}
.modal.wide{width:860px;}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal .mh h3{margin:0;font-size:14.5px;font-weight:500;}
.modal .mh .x{cursor:pointer;color:var(--text-3);font-size:19px;line-height:1;padding:2px 6px;border-radius:6px;}
.modal .mh .x:hover{background:#F4F6F8;color:var(--text-1);}
.modal .mb{padding:18px;overflow-y:auto;}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:#FAFBFC;}
/* ---------- dl ---------- */
.dl{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;font-size:13px;}
.dl dt{color:var(--text-3);}
.dl dd{margin:0;color:var(--text-1);word-break:break-all;}
.sub-h{font-size:12.5px;color:var(--text-3);margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--line);}
.sub-h:first-child{margin-top:0;padding-top:0;border-top:none;}
/* ---------- form ---------- */
.frow{display:flex;gap:12px;margin-bottom:13px;flex-wrap:wrap;}
.fitem{flex:1;min-width:150px;}
.fitem label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;}
.fitem input,.fitem select,.fitem textarea{
  width:100%;font-size:13px;padding:8px 11px;border:1px solid #DDE1E6;border-radius:8px;outline:none;
  font-family:inherit;background:#fff;color:var(--text-1);
}
.fitem textarea{resize:vertical;min-height:96px;line-height:1.6;}
.fitem input:focus,.fitem select:focus,.fitem textarea:focus{border-color:var(--brand-line);}
/* ---------- timeline ---------- */
.tl{position:relative;padding-left:20px;}
.tl .n{position:relative;padding-bottom:14px;}
.tl .n:last-child{padding-bottom:0;}
.tl .n::before{content:"";position:absolute;left:-20px;top:4px;width:8px;height:8px;border-radius:50%;background:#D8DCE1;border:2px solid #fff;}
.tl .n:first-child::before{background:var(--brand);}
.tl .n::after{content:"";position:absolute;left:-16.5px;top:14px;bottom:0;width:1px;background:#E7EAEE;}
.tl .n:last-child::after{display:none;}
.tl .n .tx{font-size:12.5px;line-height:1.6;}
.tl .n:first-child .tx{color:var(--brand);}
.tl .n .tm{font-size:11.5px;color:var(--text-3);margin-top:2px;}
/* ---------- misc ---------- */
.notice{background:#fff;border-left:3px solid var(--brand);border-radius:8px;padding:12px 15px;font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:16px;}
.notice b{color:var(--text-1);font-weight:500;}
.toast{
  position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-14px);background:#22262C;color:#fff;
  font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:all .2s;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.tabs .tb{padding:9px 15px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tabs .tb:hover{color:var(--text-1);}
.tabs .tb.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:500;}
.kv{display:flex;gap:8px;font-size:12.5px;color:var(--text-2);}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 4px 0;font-size:12.5px;color:var(--text-2);}
.pager .pg{padding:5px 10px;border:1px solid #DDE1E6;border-radius:6px;background:#fff;cursor:pointer;}
.pager .pg.on{border-color:var(--brand);color:var(--brand);}
.pager .pg[disabled]{color:#C4C9CF;cursor:not-allowed;background:#FAFBFC;}
.chk{width:15px;height:15px;cursor:pointer;accent-color:var(--brand);}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="mk">华中</div>
    华中商贸配送中心 <span class="sub">慰问品发放与配送管理平台</span>
  </div>
  <div class="who">
    <span id="today"></span>
    <span style="color:#E7EAEE">|</span>
    <span id="whoInfo">未登录</span>
    <span class="link" id="logoutBtn" style="display:none" onclick="adminLogout()">退出</span>
    <div class="av" id="whoAv">管</div>
  </div>
</div>

<div id="roBanner" class="notice"
  style="display:none;margin:0;border-radius:0;border-left:4px solid var(--warn, #D98A18);background:#FFF9EF">
  <b>只读账号：</b>当前账号仅可查看与导出数据，新增 / 修改 / 上下架 / 发货 / 导入等写操作均已禁用。
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<div class="mask" id="loginMask">
  <div class="modal" style="width:400px">
    <div class="mh"><h3>华中商贸配送中心 · 管理后台</h3></div>
    <div class="mb">
      <div class="notice" style="border-left-color:var(--brand);margin-bottom:16px">
        请使用管理端账号登录。如忘记密码，请联系配送中心系统管理员重置。
      </div>
      <div class="fitem" style="margin-bottom:12px">
        <label>账号</label>
        <input id="lgUser" autocomplete="username">
      </div>
      <div class="fitem" style="margin-bottom:12px">
        <label>密码</label>
        <input id="lgPass" type="password" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')doAdminLogin()">
      </div>
      <div id="lgMsg" style="font-size:12.5px;color:var(--danger);min-height:18px"></div>
      <button class="btn" id="lgBtn" style="width:100%" onclick="doAdminLogin()">登 录</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   后端接口适配层
   同源部署走相对路径；直接以 file:// 打开时指向本地后端
   ========================================================= */
const DAY = 86400000, HOUR = 3600000;
let clock = Date.now();
const now = () => clock;
const P = n => String(n).padStart(2,'0');
function fmt(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${d.getFullYear()}-${P(d.getMonth()+1)}-${P(d.getDate())} ${P(d.getHours())}:${P(d.getMinutes())}`;
}
function fmtD(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return `${d.getFullYear()}-${P(d.getMonth()+1)}-${P(d.getDate())}`;
}

/* 接口地址候选：
   1. 与页面同源（经 Nginx 部署的标准入口）
   2. http://localhost/api（file:// 打开、或从静态预览面板打开时的兜底）
   首个请求若遇到「网络失败 / 返回的不是接口 JSON」会自动切到下一个候选并记住。 */
const API_CANDIDATES = (function(){
  const list = [];
  if(location.protocol === 'file:') list.push('http://localhost/api');
  else list.push(location.origin + '/api');
  if(list.indexOf('http://localhost/api') < 0) list.push('http://localhost/api');
  return list;
})();
const TOKEN_KEY = 'hz_admin_token';

const API = {
  token: null,
  profile: null,
  base: null,          // 已探测出的可用接口地址
  restore(){
    try { this.token = localStorage.getItem(TOKEN_KEY) || null; } catch(e) { this.token = null; }
  },
  setToken(t){
    this.token = t || null;
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e) {}
  },
  bases(){
    const list = API_CANDIDATES.slice();
    if(this.base && list[0] !== this.base){
      const i = list.indexOf(this.base);
      if(i > 0){ list.splice(i, 1); }
      list.unshift(this.base);
    }
    return list;
  },
  resolveBase(){ return this.base || this.bases()[0]; },
  _offline(){
    const e = new Error('无法连接服务端，请通过 http://localhost/admin/ 访问并确认服务已启动');
    e.offline = true;
    return e;
  },
  async raw(method, path, body, isForm){
    let offlineErr = null;
    for(const base of this.bases()){
      const opt = { method, headers: {} };
      if(this.token) opt.headers['X-Token'] = this.token;
      if(body !== undefined && body !== null){
        if(isForm){ opt.body = body; }
        else { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
      }
      let resp;
      try {
        resp = await fetch(base + path, opt);
      } catch(e) {
        offlineErr = this._offline();
        continue;                       // 网络失败，换下一个候选地址
      }
      if(resp.status === 401){
        this.setToken(null);
        this.profile = null;
        showLogin('登录已失效，请重新登录');
        const err = new Error('登录已失效，请重新登录');
        err.code = 401;
        throw err;
      }
      let data;
      try { data = await resp.json(); }
      catch(e) {
        // 返回的不是接口 JSON（如静态预览面板的 404/HTML 页），视作地址不可用
        offlineErr = this._offline();
        continue;
      }
      this.base = base;
      if(!data || data.code !== 0){
        /* 后端鉴权失败以 HTTP 200 + code 401 返回，需据此清登录态 */
        if(data && data.code === 401){
          this.setToken(null);
          this.profile = null;
          showLogin('登录已失效，请重新登录');
        }
        const err = new Error((data && data.msg) || ('请求失败（HTTP ' + resp.status + '）'));
        err.code = data && data.code;
        throw err;
      }
      return data.data;
    }
    throw offlineErr || this._offline();
  },
  get(p){ return this.raw('GET', p); },
  /* 只读账号（viewer）在界面层直接拦截写操作，后端拦截器同样会拒绝 */
  post(p, b){
    if(!canWrite()) return Promise.reject(new Error('当前为只读账号，无操作权限'));
    return this.raw('POST', p, b === undefined ? {} : b);
  },
  del(p){
    if(!canWrite()) return Promise.reject(new Error('当前为只读账号，无操作权限'));
    return this.raw('DELETE', p);
  },
  upload(p, file){
    if(!canWrite()) return Promise.reject(new Error('当前为只读账号，无操作权限'));
    const fd = new FormData();
    fd.append('file', file);
    return this.raw('POST', p, fd, true);
  },
  /* 带鉴权头的文件下载：导出接口需校验 X-Token，不能用普通 <a href> */
  async download(path, fallbackName){
    let resp = null, offlineErr = null;
    for(const base of this.bases()){
      try {
        const opt = { method:'GET', headers:{} };
        if(this.token) opt.headers['X-Token'] = this.token;
        const r = await fetch(base + path, opt);
        if(r.status === 401){ this.setToken(null); showLogin('登录已失效，请重新登录'); throw new Error('登录已失效'); }
        if(!r.ok){
          const e = new Error('导出失败（HTTP ' + r.status + '）');
          if(r.status === 404){ e.offline = true; offlineErr = e; continue; }   // 预览面板的 404，换候选地址
          throw e;
        }
        resp = r;
        this.base = base;
        break;
      } catch(e) {
        if(e.offline){ offlineErr = e; continue; }
        if(e.name === 'TypeError'){ offlineErr = this._offline(); continue; }
        throw e;
      }
    }
    if(!resp) throw offlineErr || this._offline();
    const cd = resp.headers.get('Content-Disposition') || '';
    let name = fallbackName;
    const m = /filename\*=UTF-8''([^;]+)/i.exec(cd) || /filename="?([^";]+)"?/i.exec(cd);
    if(m){ try { name = decodeURIComponent(m[1].trim()); } catch(e){ name = m[1].trim(); } }
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);

/* 后端时间字符串 -> 毫秒时间戳。
   后端返回 ISO-8601（2026-09-01T11:20:04），需归一化为 yyyy/MM/dd HH:mm:ss 才能
   在所有浏览器（尤其 iOS Safari）稳定解析；带时区后缀的串走原生解析兜底 */
function ts(v){
  if(!v) return null;
  const t = new Date(String(v).replace(/-/g, '/').replace('T', ' ')).getTime();
  if(!isNaN(t)) return t;
  const n = new Date(String(v)).getTime();
  return isNaN(n) ? null : n;
}

/* =========================================================
   业务数据（全部来自后端接口，不再本地造数）
   ========================================================= */
const CARRIERS = [];   // 承运商字典
const PACKAGES = [];   // 套餐
const GRANTEES = [];   // 甲方提供的名单
const ORDERS   = [];   // 领取订单
const ORG_TREE = [];   // 单位 / 部门两级（由名单推导）
const NOTICES  = [];   // 公告

const NOTICE_TYPE = {1:'首页公告', 2:'配送说明', 3:'偏远地区说明'};
const NOTICE_TYPE_CODE = {'首页公告':1, '配送说明':2, '偏远地区说明':3};

function normPackage(p){
  p.goods = p.goods || [];
  /* 后端只存最近一次变更原因 + 更新时间；套餐不允许私自改内容，这里据此还原留痕展示 */
  p.changeLogs = [{
    v: 1,
    type: p.changeReason ? '修改' : '初始',
    at: ts(p.updateTime || p.createTime),
    by: '系统',
    reason: p.changeReason || '项目启动配置',
    detail: `库存 ${p.stock} 份 · ${p.status ? '已上架' : '已下架'}`
  }];
  return p;
}
function normGrantee(g){
  g.pickStatus = 0;
  return g;
}
function normOrder(o){
  ['createTime','slaDeadline','shipTime','signTime','cancelTime'].forEach(k=>{ o[k] = ts(o[k]); });
  o.carrierCode = o.carrier || null;              // 承运商编码
  o.delayReason = o.exceptionReason || '';        // 超时 / 异常说明
  o.cancelReason = o.status === 50
    ? ('订单已取消' + (o.cancelTime ? '（' + fmt(o.cancelTime) + '）' : ''))
    : '';
  o.traces = [];
  return o;
}
function normNotice(n){
  n.typeCode = n.type;
  n.type = NOTICE_TYPE[n.type] || '首页公告';
  return n;
}

/* 由名单推导单位 / 部门，供筛选下拉使用 */
function buildOrgTree(){
  ORG_TREE.length = 0;
  const m = new Map();
  GRANTEES.forEach(g=>{
    if(!m.has(g.org)) m.set(g.org, new Set());
    if(g.dept) m.get(g.org).add(g.dept);
  });
  m.forEach((depts, org)=>ORG_TREE.push({org, depts:[...depts]}));
  ORG_TREE.sort((a,b)=>String(a.org).localeCompare(String(b.org),'zh'));
}

/* 领取状态由订单推导：0 未提交 / 1 已提交待发货 / 2 已发货 / 3 已签收 */
function applyPickStatus(){
  const map = {};
  ORDERS.forEach(o=>{
    if(o.status === 50 || o.status === 70) return;
    let nv;
    if(o.status === 40) nv = 3;
    else if(o.status >= 10) nv = 2;
    else nv = 1;
    map[o.granteeId] = Math.max(map[o.granteeId] || 0, nv);
  });
  GRANTEES.forEach(g=>{ g.pickStatus = map[g.id] || 0; });
}

/* 拉取后台全部业务数据 */
async function loadAll(){
  clock = Date.now();
  const arr = await Promise.all([
    API.get('/admin/grantees?page=1&size=1000'),
    API.get('/admin/orders?page=1&size=1000'),
    API.get('/admin/packages'),
    API.get('/admin/notices'),
    API.get('/admin/orders/carriers')
  ]);

  const gPage = arr[0] || {}, oPage = arr[1] || {};

  GRANTEES.length = 0;
  (gPage.list || []).forEach(g=>GRANTEES.push(normGrantee(g)));

  ORDERS.length = 0;
  (oPage.list || []).forEach(o=>ORDERS.push(normOrder(o)));

  PACKAGES.length = 0;
  (arr[2] || []).forEach(p=>PACKAGES.push(normPackage(p)));

  NOTICES.length = 0;
  (arr[3] || []).forEach(n=>NOTICES.push(normNotice(n)));

  CARRIERS.length = 0;
  (arr[4] || []).forEach(c=>CARRIERS.push({code:c.code, name:c.name, phone:c.phone}));

  buildOrgTree();
  applyPickStatus();
  await loadTraces();
  return {granteeTotal: gPage.total || 0, orderTotal: oPage.total || 0};
}

/*
 * 物流跟踪与订单详情需要轨迹。逐单轮询会产生 N 次请求，
 * 这里用 /admin/orders/tracks/batch 一次取回。
 * 待发货订单只有登记过超时原因才有轨迹，因此一并纳入但受上限约束。
 * （真实大规模场景应在订单表冗余「最新轨迹」字段，避免回查轨迹表）
 */
async function loadTraces(){
  const need = ORDERS
    .filter(o => (o.status >= 10 && o.status !== 50) || (o.status === 0 && o.exceptionReason))
    .slice(0, 500)
    .map(o => o.id);
  if(!need.length) return;
  try {
    const tr = await API.get('/admin/orders/tracks/batch?ids=' + need.join(','));
    ORDERS.forEach(o=>{
      const list = (tr && tr[String(o.id)]) || [];
      o.traces = list.map(t=>({desc:t.description, time:ts(t.trackTime)}));
    });
  } catch(e) {
    console.warn('轨迹加载失败，不影响其它数据', e);
  }
}


/* SLA 计算：10 日发货承诺 */
const SLA = {SAFE:0, WARN:1, URGENT:2, OVER:3, SHIPPED:9};
const SLA_META = {
  0:{label:'安全',cls:'t-ok',color:'#15A05A'},
  1:{label:'预警',cls:'t-warn',color:'#D98A18'},
  2:{label:'紧急',cls:'t-danger',color:'#D64040'},
  3:{label:'超时',cls:'t-danger',color:'#D64040'},
  9:{label:'已发货',cls:'t-gray',color:'#9AA0A6'}
};
function slaInfo(o){
  if(o.status !== 0) return {key:9, ...SLA_META[9], remainMs:null, remainDays:null, over:false};
  const ms = o.slaDeadline - now();
  const days = ms / DAY;
  let key;
  if(ms <= 0) key = 3;
  else if(days <= 1) key = 2;
  else if(days <= 3) key = 1;
  else key = 0;
  return {key, ...SLA_META[key], remainMs:ms, remainDays:days, over: ms<=0};
}
function remainText(o){
  const s = slaInfo(o);
  if(s.key === 9) return '已发货';
  if(s.over) return '已超时 ' + Math.abs(Math.floor(s.remainDays)) + ' 天';
  if(s.remainDays < 1) return '剩余 ' + Math.max(0,Math.floor(s.remainMs/HOUR)) + ' 小时';
  return '剩余 ' + Math.floor(s.remainDays) + ' 天';
}
const STATUS_META = {
  0:{label:'待发货',cls:'t-brand'},
  10:{label:'已发货',cls:'t-info'},
  20:{label:'运输中',cls:'t-info'},
  30:{label:'派送中',cls:'t-warn'},
  40:{label:'已签收',cls:'t-ok'},
  50:{label:'已取消',cls:'t-gray'},
  60:{label:'配送异常',cls:'t-danger'},
  70:{label:'已退回',cls:'t-gray'}
};
const stTag = o => `<span class="tag ${STATUS_META[o.status].cls}">${STATUS_META[o.status].label}</span>`;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function exportCSV(filename, headers, rows){
  const csv = [headers.join(','), ...rows.map(r => r.map(c => {
    const v = String(c==null?'':c).replace(/"/g,'""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(','))].join('\r\n');
  const blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 200);

}

async function doImport(){

  const box = document.getElementById('importResult');

  try {
    const up = document.getElementById('importMode').value;

    box.innerHTML = `
      <div class="sub-h">导入结果 · 批次 <span class="mono">${esc(r.batchNo||'')}</span></div>

      </table></div>` : '<div class="tag t-ok">全部校验通过</div>'}
    `;
    await reload();

  } catch(e) {
    box.innerHTML = '<div class="notice" style="border-left-color:var(--danger)">' + esc(e.message) + '</div>';
    toast('导入失败：' + e.message);
  }

/* 导出：按当前筛选条件导出 Excel（含收货地址、承运商、运单号） */
async function exportGrantees(){
  const f = F.grantee, qs = [];
  if(f.kw) qs.push('keyword=' + encodeURIComponent(f.kw));
  if(f.org) qs.push('org=' + encodeURIComponent(f.org));

/* 套餐内容按招标要求不可私自更改，因此任何库存/状态变更都必须带变更原因 */
function packagePayload(p, overrides){
  return Object.assign({
    id: p.id, no: p.no, name: p.name, sub: p.sub, price: p.price,
    stock: p.stock, warn: p.warn, sort: p.sort, status: p.status,
    goods: (p.goods || []).map(g=>({name:g.name, spec:g.spec, qty:g.qty, unit:g.unit}))
  }, overrides || {});
}
async function applyStock(id){
  const p = PACKAGES.find(x=>x.id===id);
  if(!p) return;
  const add = Number(document.getElementById('pkgAdd').value || 0);
  const reason = (document.getElementById('pkgReason').value || '').trim();
  if(!reason){ toast('请填写变更原因，该字段为必填'); return; }
  if(!add){ toast('请填写本次入库数量'); return; }
  if(p.stock + add < 0){ toast('调整后库存不能为负数'); return; }
  const btn = document.getElementById('pkgBtn');
  if(btn){ btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    await API.post('/admin/packages', packagePayload(p, {stock: p.stock + add, changeReason: reason}));
    closeModal();
    await reload();
    toast('库存已调整并留痕：' + p.stock + ' → ' + (p.stock + add));
  } catch(e) {
    toast('调整失败：' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '确认调整'; }
  }
}
async function createPackage(){
  const name = (document.getElementById('pkgName').value || '').trim();
  const reason = (document.getElementById('pkgReason').value || '').trim();
  if(!name){ toast('请填写套餐名称'); return; }
  if(!reason){ toast('请填写变更原因，该字段为必填'); return; }
  const btn = document.getElementById('pkgBtn');
  if(btn){ btn.disabled = true; btn.textContent = '提交中…'; }
  try {
    await API.post('/admin/packages', {
      no: (document.getElementById('pkgNo').value || '').trim(),
      name: name,
      sub: (document.getElementById('pkgSub').value || '').trim(),
      stock: Number(document.getElementById('pkgStock').value || 0),
      warn: Number(document.getElementById('pkgWarn').value || 100),
      status: 1,
      changeReason: reason,
      goods: []
    });
    closeModal();
    await reload();
    toast('套餐已创建');
  } catch(e) {
    toast('创建失败：' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '确认创建'; }
  }
}
async function togglePackage(id){
  const p = PACKAGES.find(x=>x.id===id);
  if(!p) return;
  const going = p.status ? '下架' : '上架';
  const reason = prompt('请填写' + going + '原因（将记入留痕）：',
    going === '下架' ? '库存售罄，暂停展示' : '补货完成，恢复展示');
  if(reason === null) return;
  try {
    await API.post('/admin/packages', packagePayload(p, {
      status: p.status ? 0 : 1,
      changeReason: reason || '未填写'
    }));
    await reload();
    toast('套餐已' + going);
  } catch(e) {
    toast(going + '失败：' + e.message);
  }
}

async function doShip(){
  const carrierCode = document.getElementById('shipCarrier').value;
  const rawNo = (document.getElementById('shipWaybills').value || '')
    .split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const ids = [...orderSel];
  if(!ids.length){ toast('请先勾选需要发货的订单'); return; }
  const btn = document.getElementById('shipBtn');
  if(btn){ btn.disabled = true; btn.textContent = '发货中…'; }
  try {
    let r;
    if(rawNo.length){
      /* 手工填写了运单号：逐单提交，保证运单号与订单一一对应 */
      let success = 0, fails = [];
      for(let i = 0; i < ids.length; i++){
        if(!rawNo[i]){ fails.push('第 ' + (i + 1) + ' 笔未填写运单号，已跳过'); continue; }
        try {
          const one = await API.post('/admin/orders/ship',
            {orderIds:[ids[i]], carrier: carrierCode, waybillNo: rawNo[i]});
          success += (one && one.successCount) || 0;
          ((one && one.failList) || []).forEach(x=>fails.push(x));
        } catch(e) { fails.push(e.message); }
      }
      r = {successCount: success, failCount: fails.length, failList: fails};
    } else {
      /* 未填运单号：整批提交，由后端按承运商规则生成运单号 */
      r = await API.post('/admin/orders/ship', {orderIds: ids, carrier: carrierCode});
    }
    orderSel.clear();
    closeModal();
    await reload();
    const failCount = (r && r.failCount) || 0;
    toast('发货完成：成功 ' + ((r && r.successCount) || 0) + ' 笔' + (failCount ? '，失败 ' + failCount + ' 笔' : ''));
    if(failCount){
      const fails = (r && r.failList) || [];
      if(fails.length) openModal('部分订单发货失败', `
        <div class="notice" style="border-left-color:var(--danger);margin-bottom:12px">
          以下订单未能发货，请核对后重试。已成功的订单不受影响。
        </div>
        <div class="tbl-wrap"><table class="tbl" style="min-width:auto">
          <thead><tr><th>原因</th></tr></thead>
          <tbody>${fails.map(x=>`<tr><td>${esc(x)}</td></tr>`).join('')}</tbody>
        </table></div>`, '<button class="btn sec" onclick="closeModal()">知道了</button>');
    }
  } catch(e) {
    toast('发货失败：' + e.message);
    if(btn){ btn.disabled = false; btn.textContent = '确认发货'; }
  }
}

/* SLA 定时预警记录：后端每日自动扫描落库（SlaAlertJob），此处只读展示 + 支持手动触发 */
let SLA_ALERTS = [];
let slaAlertLoading = false;
let slaAlertLoaded = false;
async function loadSlaAlerts(){
  if(slaAlertLoading || slaAlertLoaded) return;   // 已尝试过就不要再触发：结果为空或失败时避免 render→pageSla→再拉 的死循环
  slaAlertLoading = true;
  try { SLA_ALERTS = (await API.get('/admin/sla/alerts?days=14')) || []; }
  catch(e){ SLA_ALERTS = []; }
  slaAlertLoading = false;
  slaAlertLoaded = true;
  if(page === 'sla') render();
}
async function scanSla(){
  try {
    const r = await API.post('/admin/sla/scan?notify=false');
    SLA_ALERTS = [];
    slaAlertLoaded = false;   // 手动扫描后强制重新拉取最新的定时预警记录
    await loadSlaAlerts();
    toast(`扫描完成：已超期 ${r.overdue} 笔，24 小时内到期 ${r.dueIn24h} 笔，72 小时内 ${r.dueIn72h} 笔`);
  } catch(e) { toast('扫描失败：' + e.message); }
}
const SLA_ALERT_LEVEL = {
  3:{t:'已超期',    c:'t-danger'},
  2:{t:'24 小时内', c:'t-danger'},
  1:{t:'72 小时内', c:'t-warn'}

function buildReport(tab){
  const valid = ORDERS.filter(o=>o.status!==50);
  if(tab === 'org'){
    const m = {};
    GRANTEES.forEach(g=>{
      m[g.org] = m[g.org] || {org:g.org, total:0, submitted:0, pending:0, shipped:0, signed:0};
      m[g.org].total++;
      if(g.pickStatus>0) m[g.org].submitted++;
    });
    valid.forEach(o=>{
      const r = m[o.org]; if(!r) return;
      if(o.status===0) r.pending++;
      else if(o.status===40) r.signed++; else r.shipped++;
    });
    return {
      headers:['所属单位','应领人数','已提交','未提交','提交率','待发货','已发货','已签收'],
      rows:Object.values(m).map(r=>[r.org, r.total, r.submitted, r.total-r.submitted,
        (r.submitted/r.total*100).toFixed(1)+'%', r.pending, r.shipped, r.signed])
    };
  }
  if(tab === 'pkg'){
    return {
      headers:['套餐编号','套餐名称','内容清单项数','已选份数','占比','当前库存','状态'],
      rows:PACKAGES.map(p=>{
        const cnt = valid.filter(o=>o.packageId===p.id).length;
        return [p.no, p.name, p.goods.length, cnt, (cnt/Math.max(1,valid.length)*100).toFixed(1)+'%', p.stock, p.status?'已上架':'已下架'];
      })
    };
  }
  if(tab === 'area'){
    const m = {};
    valid.forEach(o=>{
      m[o.province] = m[o.province] || {p:o.province, cnt:0, cities:new Set(), pending:0, shipped:0};
      m[o.province].cnt++;
      m[o.province].cities.add(o.city);
      if(o.status===0) m[o.province].pending++; else m[o.province].shipped++;
    });
    return {
      headers:['省份','覆盖城市数','订单数','待发货','已发货'],
      rows:Object.values(m).sort((a,b)=>b.cnt-a.cnt).map(r=>[r.p, r.cities.size, r.cnt, r.pending, r.shipped])
    };
  }
  // 发放明细
  return {
    headers:['订单号','工号','领取人','所属单位','部门','套餐','数量','收货人','手机号','收货地址','代收点授权','状态','提交时间','发货时间','承运商','运单号','签收时间'],
    rows:ORDERS.map(o=>[o.orderNo,o.empNo,o.granteeName,o.org,o.dept,o.packageName,o.quantity,o.receiver,o.phone,
      o.province+o.city+o.district+o.detail, o.allowStation?'允许':'不允许', STATUS_META[o.status].label,
      fmt(o.createTime),fmt(o.shipTime),o.carrierName||'',o.waybillNo||'',fmt(o.signTime)])
  };
}
function pageReport(){
  const tab = F.report.tab;

        ${!AUDIT.loading && !AUDIT.list.length ? `<tr><td colspan="8" style="text-align:center;color:var(--text-3);padding:24px">暂无记录</td></tr>` : ''}
        ${AUDIT.list.map(l=>`<tr>
          <td class="nowrap">${fmt(ts(l.createTime))}</td>
          <td class="nowrap">${esc(l.adminName||l.adminAccount||'—')}
            <div style="font-size:11px;color:var(--text-3)">${esc(l.adminRole||'')}</div></td>
          <td class="nowrap">${esc(AUDIT_MODULES[l.module]||l.module||'')}</td>
          <td class="nowrap">${esc(AUDIT_ACTIONS[l.action]||l.action||'')}</td>
          <td style="font-size:12px;color:var(--text-2);max-width:360px">${esc(l.target||'')}${l.detail?'　'+esc(l.detail):''}</td>
          <td class="nowrap">${l.rowCount==null?'—':l.rowCount}</td>
          <td class="nowrap" style="font-size:12px">${esc(l.ip||'—')}</td>
          <td class="nowrap">${l.result==='success'?'<span class="tag t-ok">成功</span>':'<span class="tag t-danger">失败</span>'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}
function setAuditFilter(k, v){
  F.audit[k] = v;
  AUDIT.loaded = false;
  loadAudit();
}
async function loadAudit(){
  const f = F.audit;
  AUDIT.loading = true;
  if(page === 'audit') render();
  const q = new URLSearchParams({page:'1', size:'200'});
  if(f.module) q.set('module', f.module);
  if(f.action) q.set('action', f.action);
  if(f.kw) q.set('keyword', f.kw);
  if(f.date) q.set('date', f.date);
  try {
    const r = await API.get('/admin/operation-logs?' + q.toString());
    AUDIT.list = (r && r.list) || [];
    AUDIT.total = (r && r.total) || 0;
    AUDIT.loaded = true;
  } catch(e) {
    AUDIT.list = []; AUDIT.total = 0;
    toast('日志加载失败：' + e.message);
  }
  AUDIT.loading = false;
  if(page === 'audit') render();
}

/* =========================================================
   渲染
   ========================================================= */
const PAGES = {
  dashboard:pageDashboard, grantees:pageGrantees, packages:pagePackages,
  orders:pageOrders, ship:pageShip, logistics:pageLogistics,
  sla:pageSla, report:pageReport, notice:pageNotice, audit:pageAudit
};
function render(){
  const el = document.getElementById('main');
  const keepScroll = el.scrollTop;
  renderSidebar();
  el.innerHTML = (PAGES[page] || pageDashboard)();
  el.scrollTop = keepScroll;
}
/* 搜索框输入：重渲染后恢复焦点与光标位置，避免每输一个字就失焦 */
function setFilter(path, value, el){
  const [g, k] = path.split('.');
  F[g][k] = value;
  const caret = el && el.selectionStart != null ? el.selectionStart : value.length;
  render();
  const t = document.querySelector('#main .filters input.search');
  if(t){
    t.focus();
    try { t.setSelectionRange(caret, caret); } catch(e){}
  }
}
/* =========================================================
   登录态与启动
   ========================================================= */
function showLogin(msg){
  const el = document.getElementById('loginMask');
  if(el) el.classList.add('show');
  const box = document.getElementById('lgMsg');
  if(box) box.textContent = msg || '';
}
function hideLogin(){
  const el = document.getElementById('loginMask');
  if(el) el.classList.remove('show');
}
const ROLE_NAME = {admin:'系统管理员', operator:'项目运营', viewer:'只读查看'};
function renderTopbar(){
  const d = new Date();
  const today = document.getElementById('today');
  if(today) today.textContent = `${d.getFullYear()}-${P(d.getMonth()+1)}-${P(d.getDate())}`;
  const p = API.profile || {};
  const info = document.getElementById('whoInfo');
  if(info){
    const roleText = ROLE_NAME[p.role] || '管理端用户';
    const who = p.realName || p.username;
    /* realName 与角色名相同时不重复展示 */
    info.textContent = p.username ? (who && who !== roleText ? roleText + ' · ' + who : roleText) : '未登录';
  }
  const av = document.getElementById('whoAv');
  if(av) av.textContent = String(p.realName || p.username || '管').slice(0,1);
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.style.display = p.username ? 'inline' : 'none';
  const ro = document.getElementById('roBanner');
  if(ro) ro.style.display = (p.username && p.role === 'viewer') ? 'block' : 'none';
}
async function doAdminLogin(){
  const username = (document.getElementById('lgUser').value || '').trim();
  const password = document.getElementById('lgPass').value || '';
  const box = document.getElementById('lgMsg');
  if(!username || !password){ box.textContent = '请填写账号与密码'; return; }
  const btn = document.getElementById('lgBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  try {
    const d = await API.post('/admin/auth/login', {username: username, password: password});
    API.setToken(d.token);
    API.profile = d;
    hideLogin();
    await reload();
  } catch(e) {
    box.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}
async function adminLogout(){
  try { await API.post('/admin/auth/logout'); } catch(e) {}
  API.setToken(null);
  API.profile = null;
  renderTopbar();
  showLogin('已退出登录，请重新登录');
}
/* 数据变更后统一重新拉取并重绘 */
async function reload(){
  await loadAll();
  hideLogin();          // 数据能取到即说明登录态有效，确保登录层不会残留
  renderTopbar();
  render();
}
async function tryRestoreSession(){
  if(!API.token) return false;
  try {
    API.profile = await API.get('/admin/auth/profile');
    return true;
  } catch(e) {
    API.setToken(null);
    return false;
  }
}

(async function start(){
  renderTopbar();
  if(await tryRestoreSession()){
    try {
      await reload();
      return;
    } catch(e) {
      console.error('初始化失败', e);
      toast('数据加载失败：' + e.message);
    }
  }
  showLogin('');
})();
</script>
