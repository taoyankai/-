# ============================================================================
#  华中商贸配送中心 · 一键部署编排
#
#  本地启动： docker compose up -d --build
#  查看状态： docker compose ps
#  查看日志： docker compose logs -f api
#  停止服务： docker compose down
#  彻底重置： docker compose down -v   （会清空数据库，慎用）
#
#  访问入口：
#    小程序 H5  http://localhost:${WEB_PORT:-80}/
#    管理后台   http://localhost:${WEB_PORT:-80}/admin/
#    后端接口   http://localhost:${WEB_PORT:-80}/api/
#    健康检查   http://localhost:${WEB_PORT:-80}/healthz
# ============================================================================

services:

  # ---------------- MySQL ----------------
  mysql:
    image: mysql:8.0
    container_name: hz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hz_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hz_delivery}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表并写入初始数据
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - hz-net

  # ---------------- Redis ----------------
  redis:
    image: redis:7.4-alpine
    container_name: hz-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - hz-net

  # ---------------- 后端服务 ----------------
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: hz-delivery-server:1.0.0
    container_name: hz-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hz_delivery}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hz_root_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SLA_DAYS: ${SLA_DAYS:-10}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-1}
      MOCK_SMS_CODE: ${MOCK_SMS_CODE:-}
      LOGIN_MODE: ${LOGIN_MODE:-sms}
      LOGIN_MAX_FAIL: ${LOGIN_MAX_FAIL:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-10}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-10}
      SLA_ALERT_PHONE: ${SLA_ALERT_PHONE:-}
      SLA_ALERT_CRON: ${SLA_ALERT_CRON:-0 30 9 * * ?}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_TEST_ENABLED: ${SMS_TEST_ENABLED:-false}
      SMS_HBU_BASE_URL: ${SMS_HBU_BASE_URL:-http://sim.hbu.edu.cn/sms-hbu/api}
      SMS_HBU_CID: ${SMS_HBU_CID:-7}
      SMS_HBU_KEY: ${SMS_HBU_KEY:-}
      SMS_HBU_MODEL: ${SMS_HBU_MODEL:-yzmmb}
      SMS_HBU_TIME_MINUTES: ${SMS_HBU_TIME_MINUTES:-5}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:-hz@2026}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Dfile.encoding=UTF-8}
    volumes:
      - api-logs:/app/logs
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - hz-net

  # ---------------- 前端与反向代理 ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hz-nginx
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 小程序 / H5 页面
      - ./miniapp:/usr/share/nginx/html/h5:ro
      # 管理后台页面
      - ./admin:/usr/share/nginx/html/admin:ro
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - hz-net

volumes:
  mysql-data:
    name: hz-mysql-data
  redis-data:
    name: hz-redis-data
  api-logs:
    name: hz-api-logs

networks:
  hz-net:
    name: hz-net
    driver: bridge
