# ============================================================================
#  华中商贸配送中心 · 统一部署入口（GitHub 源码 + Docker Compose）
#  仅 Nginx 暴露 WEB_PORT；MySQL / Redis / API 只通过容器网络访问。
#  默认用正式初始化脚本，只在 MySQL 数据卷为空时执行。
#  沿用原有容器名和数据卷名；已有数据卷不会自动移除演示数据。
#
#  使用：
#    cd /opt/hz-delivery/deploy/server
#    cp .env.example .env && vi .env        # 改密码！
#    docker compose config --quiet
#    docker compose build api
#    docker compose up -d --no-build
#    docker compose ps
#
#  /             教职工端 H5          /admin/          管理后台
#  /api/         后端接口             /healthz         Nginx 存活
#  /actuator/health                  后端及数据库、Redis 健康
# ============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------- MySQL（仅内部网络） ----------------
  mysql:
    image: mysql:8.0
    container_name: hz-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hz_delivery}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
    volumes:
      - mysql-data:/var/lib/mysql
      # 文件缺失时立即报错，避免 Docker 静默创建同名目录。
      - type: bind
        source: ../../db/init-production.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1500M
    networks:
      - hz-net

  # ---------------- Redis（仅内部网络） ----------------
  redis:
    image: redis:7.4-alpine
    container_name: hz-redis
    restart: unless-stopped
    logging: *default-logging
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      TZ: Asia/Shanghai
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 400M
    networks:
      - hz-net

  # ---------------- 后端服务（仅内部网络，由 Nginx 反代） ----------------
  api:
    image: hz-delivery-server:${APP_VERSION:?必须在 .env 中设置 APP_VERSION}
    # 先显式 build，再 up --no-build；不从公共仓库拉取这个本地构建的镜像。
    pull_policy: never
    build:
      context: ../../server
      dockerfile: Dockerfile
    container_name: hz-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-hz_delivery}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env 中设置}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SLA_DAYS: ${SLA_DAYS:-10}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-1}
      MOCK_SMS_CODE: ${MOCK_SMS_CODE:-}
      LOGIN_MODE: ${LOGIN_MODE:-sms}
      LOGIN_MAX_FAIL: ${LOGIN_MAX_FAIL:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-10}
      ADMIN_LOGIN_MAX_FAIL: ${ADMIN_LOGIN_MAX_FAIL:-5}
      ADMIN_LOGIN_LOCK_MINUTES: ${ADMIN_LOGIN_LOCK_MINUTES:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      SMS_DAILY_LIMIT: ${SMS_DAILY_LIMIT:-10}
      SLA_ALERT_PHONE: ${SLA_ALERT_PHONE:-}
      SLA_ALERT_CRON: ${SLA_ALERT_CRON:-0 30 9 * * ?}
      LOGISTICS_PROVIDER: ${LOGISTICS_PROVIDER:-disabled}
      LOGISTICS_QUERY_ON_ACCESS: ${LOGISTICS_QUERY_ON_ACCESS:-true}
      LOGISTICS_VALIDATE_ON_SHIP: ${LOGISTICS_VALIDATE_ON_SHIP:-true}
      LOGISTICS_MIN_INTERVAL_MINUTES: ${LOGISTICS_MIN_INTERVAL_MINUTES:-30}
      LOGISTICS_BATCH_SIZE: ${LOGISTICS_BATCH_SIZE:-50}
      LOGISTICS_SYNC_CRON: ${LOGISTICS_SYNC_CRON:-0 */30 * * * ?}
      KUAIDI100_KEY: ${KUAIDI100_KEY:-}
      KUAIDI100_CUSTOMER: ${KUAIDI100_CUSTOMER:-}
      KUAIDI100_BASE_URL: ${KUAIDI100_BASE_URL:-https://poll.kuaidi100.com/poll/query.do}
      KUAIDI100_CONNECT_TIMEOUT: ${KUAIDI100_CONNECT_TIMEOUT:-5}
      KUAIDI100_READ_TIMEOUT: ${KUAIDI100_READ_TIMEOUT:-10}
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      SMS_AUTH_PROVIDER: ${SMS_AUTH_PROVIDER:-local}
      SMS_AUTH_TEST_ENABLED: ${SMS_AUTH_TEST_ENABLED:-false}
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${ALIBABA_CLOUD_ACCESS_KEY_ID:-}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:-}
      ALIYUN_PNVS_SCHEME_NAME: ${ALIYUN_PNVS_SCHEME_NAME:-hz-client-login}
      SMS_TEST_ENABLED: ${SMS_TEST_ENABLED:-false}
      SMS_HBU_BASE_URL: ${SMS_HBU_BASE_URL:-http://sim.hbu.edu.cn/sms-hbu/api}
      SMS_HBU_CID: ${SMS_HBU_CID:-7}
      SMS_HBU_KEY: ${SMS_HBU_KEY:-}
      SMS_HBU_MODEL: ${SMS_HBU_MODEL:-yzmmb}
      SMS_HBU_TIME_MINUTES: ${SMS_HBU_TIME_MINUTES:-5}
      ADMIN_INIT_PASSWORD: ${ADMIN_INIT_PASSWORD:?必须在 .env 中设置}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70.0 -XX:+UseG1GC -Dfile.encoding=UTF-8}
    volumes:
      - api-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - hz-net

  # ---------------- 前端与反向代理（唯一对外入口） ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: hz-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ../nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../miniapp
        target: /usr/share/nginx/html/h5
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../admin
        target: /usr/share/nginx/html/admin
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${WEB_PORT:-80}:80"
    deploy:
      resources:
        limits:
          memory: 300M
    networks:
      - hz-net

volumes:
  mysql-data:
    name: hz-mysql-data
  redis-data:
    name: hz-redis-data
  api-logs:
    name: hz-api-logs

networks:
  hz-net:
    name: hz-net
    driver: bridge
