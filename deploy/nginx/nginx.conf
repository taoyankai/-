worker_processes auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # 登录与名单探测接口按来源 IP 限速，降低暴力破解和手机号枚举风险
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=sms_send:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=list_check:10m rate=30r/m;
    limit_req_status 429;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 20m;
    client_body_timeout 15s;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    upstream hz_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # 页面仍使用内联脚本和事件处理器；保留 unsafe-inline 以兼容现有单文件前端。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost http://127.0.0.1; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

        # ---------- 小程序 / H5 ----------
        location / {
            root /usr/share/nginx/html/h5;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---------- 管理后台 ----------
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 后台入口重定向，避免 /admin 少写斜杠导致 404
        location = /admin {
            return 301 /admin/;
        }

        location = /api/admin/auth/login {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://hz_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        location = /api/client/auth/send-code {
            limit_req zone=sms_send burst=2 nodelay;
            proxy_pass http://hz_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        location = /api/client/auth/check {
            limit_req zone=list_check burst=10 nodelay;
            proxy_pass http://hz_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # ---------- 后端接口 ----------
        location /api/ {
            proxy_pass http://hz_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # 导出 Excel 等耗时接口，放宽超时
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
            proxy_buffering off;
        }

        # 健康检查透传
        # 注意：必须显式设置 Host，否则 nginx 默认传上游名 hz_api，
        # 其中的下划线不符合 RFC 主机名规范，会被 Tomcat 以 400 拒绝
        location /actuator/health {
            proxy_pass http://hz_api/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
