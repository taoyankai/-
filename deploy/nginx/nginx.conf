worker_processes auto;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    upstream hz_api {
        server api:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ---------- 小程序 / H5 ----------
        location / {
            root /usr/share/nginx/html/h5;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---------- 管理后台 ----------
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 后台入口重定向，避免 /admin 少写斜杠导致 404
        location = /admin {
            return 301 /admin/;
        }

        # ---------- 后端接口 ----------
        location /api/ {
            proxy_pass http://hz_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # 导出 Excel 等耗时接口，放宽超时
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
            proxy_buffering off;
        }

        # 健康检查透传
        # 注意：必须显式设置 Host，否则 nginx 默认传上游名 hz_api，
        # 其中的下划线不符合 RFC 主机名规范，会被 Tomcat 以 400 拒绝
        location /actuator/health {
            proxy_pass http://hz_api/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        location = /healthz {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
