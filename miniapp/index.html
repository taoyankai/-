<title>华中商贸配送中心 · 教职工慰问品领取</title>
<style>
:root{
  --brand:#C93B32;
  --brand-dark:#A62B24;
  --brand-light:#FDF0EE;
  --brand-line:#F3D6D2;
  --gold:#C8912F;
  --gold-light:#FBF3E2;
  --text-1:#1F2226;
  --text-2:#5B6169;
  --text-3:#9AA0A6;
  --line:#EBEDF0;
  --bg:#F5F6F8;
  --ok:#15A05A;
  --ok-light:#E8F6EE;
  --warn:#D98A18;
  --warn-light:#FDF4E4;
  --danger:#D64040;
  --danger-light:#FCEEEE;
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#EEF0F3;
  color:var(--text-1);
  display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 48px;
  min-height:100vh;
}
.stage-head{width:100%;max-width:900px;margin-bottom:18px;text-align:center;}
.stage-head h1{font-size:17px;font-weight:500;margin:0 0 6px;color:#1F2226;letter-spacing:.2px;}
.stage-head p{font-size:13px;color:#7A8087;margin:0;line-height:1.6;}
.stage-head .tools{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.ghost-btn{
  font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid #D6DAE0;
  background:#fff;color:#4A5058;cursor:pointer;font-family:inherit;
}
.ghost-btn:hover{border-color:var(--brand);color:var(--brand);}

/* ---------- phone ---------- */
.phone{
  width:375px;height:760px;background:#fff;border-radius:38px;
  border:1px solid #D9DDE3;
  box-shadow:0 18px 50px rgba(24,30,40,.14), 0 2px 8px rgba(24,30,40,.06);
  position:relative;overflow:hidden;display:flex;flex-direction:column;flex-shrink:0;
}

/* ---------- 手机端全屏适配 ----------
   本页最初按桌面演示页设计：中间一个固定 375×760 的手机壳，顶部还有演示工具条，
   全文没有任何媒体查询。直接用手机打开会出现三个问题：顶部多出一块演示信息、
   手机壳固定高度把底部导航截断、内容区与页面形成双层滚动。
   因此在触屏设备或窄屏下切换为真正的全屏应用。

   判定条件三选一（命中任一即生效）：
     · max-width:640px —— 竖屏手机
     · pointer:coarse   —— 任何触屏设备，用于横屏手机
     · max-height:520px —— 横屏手机兜底（headless 等无法上报 pointer 的场景） */
@media (max-width:640px),(pointer:coarse),(max-height:520px){
  body{padding:0;display:block;background:var(--bg);min-height:100vh;}
  .stage-head{display:none;}
  .phone{
    width:100%;height:100vh;height:100dvh;max-width:none;
    border:none;border-radius:0;box-shadow:none;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
}
.navbar{
  height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  position:relative;font-size:16px;font-weight:500;background:#fff;z-index:3;
  border-bottom:1px solid var(--line);
}
.navbar .nav-back{
  position:absolute;left:10px;top:0;height:44px;display:flex;align-items:center;
  padding:0 10px;cursor:pointer;color:#33383E;
}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg);position:relative;scrollbar-width:thin;}
.screen::-webkit-scrollbar{width:0;}
.page{padding-bottom:22px;animation:fade .18s ease;}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- tabbar ---------- */
.tabbar{
  height:56px;flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--line);
  padding-bottom:2px;z-index:3;
}
.tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;color:#9AA0A6;cursor:pointer;user-select:none;
}
.tabbar .tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.tabbar .tab.on{color:var(--brand);}

/* ---------- common ---------- */
.sec{padding:14px;}
.card{background:#fff;border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.card.tight{padding:0;}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-hd h3{margin:0;font-size:14.5px;font-weight:500;}
.card-hd .more{font-size:12px;color:var(--text-3);cursor:pointer;}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;}
.row:last-child{border-bottom:none;}
.row .k{color:var(--text-2);flex-shrink:0;margin-right:12px;}
.row .v{color:var(--text-1);text-align:right;word-break:break-all;}
.row .v.muted{color:var(--text-3);}
.btn{
  display:block;width:100%;border:none;border-radius:10px;padding:13px;
  font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff;
  transition:opacity .15s;
}
.btn:active{opacity:.85;}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand-line);}
.btn.line{background:#fff;color:var(--text-2);border:1px solid #E0E3E8;}
.btn[disabled]{background:#E6E8EB;color:#A8AEB5;cursor:not-allowed;}
.btn.sm{padding:8px 14px;font-size:12.5px;width:auto;display:inline-block;border-radius:8px;}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;line-height:1.5;}
.tag.brand{background:var(--brand-light);color:var(--brand);}
.tag.gold{background:var(--gold-light);color:var(--gold);}
.tag.ok{background:var(--ok-light);color:var(--ok);}
.tag.warn{background:var(--warn-light);color:var(--warn);}
.tag.gray{background:#F1F3F5;color:#7A8087;}
.tag.danger{background:var(--danger-light);color:var(--danger);}
.muted{color:var(--text-3);}
.hint{font-size:11.5px;color:var(--text-3);line-height:1.6;}

/* ---------- login ---------- */
.login-wrap{padding:34px 26px 26px;}
.brand-block{text-align:center;margin-bottom:30px;}
.brand-logo{
  width:64px;height:64px;border-radius:18px;background:var(--brand);color:#fff;margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;letter-spacing:1px;
}
.brand-block h2{margin:0 0 6px;font-size:19px;font-weight:500;}
.brand-block p{margin:0;font-size:12.5px;color:var(--text-3);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;}
.field .box{display:flex;align-items:center;background:#F6F7F9;border:1px solid #EDEFF2;border-radius:10px;padding:0 12px;}
.field .box:focus-within{border-color:var(--brand-line);background:#fff;}
.field input,.field select,.field textarea{
  flex:1;border:none;background:transparent;outline:none;font-size:14px;padding:12px 0;
  font-family:inherit;color:var(--text-1);width:100%;
}
.field textarea{resize:none;line-height:1.6;padding:12px 0;}
.field .code-btn{
  font-size:12.5px;color:var(--brand);background:none;border:none;cursor:pointer;
  padding:6px 0 6px 12px;border-left:1px solid #E6E9ED;font-family:inherit;white-space:nowrap;
}
.field .code-btn:disabled{color:var(--text-3);cursor:default;}
.err-tip{font-size:11.5px;color:var(--danger);margin-top:6px;line-height:1.5;display:none;}
.err-tip.show{display:block;}

/* ---------- home ---------- */
.hero{
  background:var(--brand);padding:18px 16px 46px;color:#fff;position:relative;
}
.hero .greet{font-size:12.5px;opacity:.85;margin-bottom:6px;}
.hero h2{margin:0;font-size:19px;font-weight:500;letter-spacing:.3px;}
.hero .org{font-size:12px;opacity:.82;margin-top:7px;}
.hero .promise{
  position:absolute;left:16px;right:16px;bottom:-30px;background:#fff;border-radius:var(--radius);
  padding:13px 14px;box-shadow:0 4px 14px rgba(24,30,40,.08);display:flex;align-items:center;gap:11px;
}
.hero .promise .ic{width:34px;height:34px;border-radius:9px;background:var(--gold-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hero .promise .tx b{display:block;font-size:13px;color:var(--text-1);font-weight:500;margin-bottom:2px;}
.hero .promise .tx span{font-size:11.5px;color:var(--text-3);}
.hero-pad{height:44px;}

.steps{display:flex;padding:6px 4px 2px;}
.steps .st{flex:1;text-align:center;position:relative;}
.steps .st .dot{
  width:26px;height:26px;border-radius:50%;background:var(--brand-light);color:var(--brand);
  font-size:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:500;
}
.steps .st.done .dot{background:var(--brand);color:#fff;}
.steps .st.active .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(201,59,50,.12);}
.steps .st span{font-size:11px;color:var(--text-2);}
.steps .st::after{
  content:"";position:absolute;top:13px;left:calc(50% + 18px);width:calc(100% - 36px);height:1px;background:#E6E9ED;
}
.steps .st:last-child::after{display:none;}

.notice-bar{
  display:flex;align-items:center;gap:8px;background:var(--gold-light);border-radius:10px;
  padding:10px 12px;font-size:12px;color:var(--gold);line-height:1.5;
}
.notice-bar svg{flex-shrink:0;}

/* ---------- package ---------- */
.pkg{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;
  display:flex;flex-direction:column;
}
.pkg .thumb{
  height:112px;background:#FAFBFC;border-bottom:1px solid var(--line);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
}
.pkg .thumb .ph-ic{
  width:38px;height:38px;border-radius:11px;background:var(--brand-light);
  display:flex;align-items:center;justify-content:center;
}
.pkg .thumb .ph{font-size:11px;color:#B0B6BD;letter-spacing:.5px;}
.pkg .thumb .no{
  position:absolute;top:9px;right:10px;font-size:10.5px;color:var(--text-3);
  background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;
}
.pkg .thumb .sold-out{
  position:absolute;inset:0;background:rgba(255,255,255,.78);display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#7A8087;font-weight:500;
}
.pkg .body{padding:13px 14px 14px;}
.pkg .body h4{margin:0 0 4px;font-size:15px;font-weight:500;}
.pkg .body .sub{font-size:12px;color:var(--text-3);margin-bottom:9px;}
.pkg .goods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.pkg .goods span{font-size:11.5px;color:var(--text-2);background:#F5F6F8;border-radius:6px;padding:4px 8px;}
.pkg .foot{display:flex;align-items:center;justify-content:space-between;padding-top:11px;border-top:1px solid var(--line);}
.pkg .foot .stock{font-size:12px;color:var(--text-3);}
.pkg.disabled{opacity:.72;}

.stepper{display:flex;align-items:center;gap:0;border:1px solid #E3E6EA;border-radius:8px;overflow:hidden;}
.stepper button{
  width:32px;height:30px;border:none;background:#fff;font-size:16px;color:var(--text-2);
  cursor:pointer;font-family:inherit;line-height:1;
}
.stepper button:disabled{color:#CFD4D9;cursor:not-allowed;}
.stepper .num{width:40px;text-align:center;font-size:14px;border-left:1px solid #E3E6EA;border-right:1px solid #E3E6EA;line-height:30px;}

.goods-table{width:100%;border-collapse:collapse;font-size:13px;}
.goods-table th{
  text-align:left;font-weight:400;color:var(--text-3);font-size:11.5px;padding:0 0 8px;
  border-bottom:1px solid var(--line);
}
.goods-table td{padding:9px 0;border-bottom:1px solid #F4F5F7;color:var(--text-1);}
.goods-table tr:last-child td{border-bottom:none;}
.goods-table td:nth-child(2),.goods-table th:nth-child(2){text-align:center;color:var(--text-2);}
.goods-table td:nth-child(3),.goods-table th:nth-child(3){text-align:right;color:var(--text-2);}

/* ---------- timeline ---------- */
.timeline{position:relative;padding-left:22px;}
.timeline .ti{position:relative;padding-bottom:16px;}
.timeline .ti:last-child{padding-bottom:0;}
.timeline .ti::before{
  content:"";position:absolute;left:-22px;top:4px;width:9px;height:9px;border-radius:50%;
  background:#D8DCE1;border:2px solid #fff;
}
.timeline .ti:first-child::before{background:var(--brand);}
.timeline .ti::after{
  content:"";position:absolute;left:-18px;top:15px;bottom:0;width:1px;background:#E6E9ED;
}
.timeline .ti:last-child::after{display:none;}
.timeline .ti .tt{font-size:13px;color:var(--text-1);line-height:1.55;}
.timeline .ti:first-child .tt{color:var(--brand);font-weight:500;}
.timeline .ti .tm{font-size:11.5px;color:var(--text-3);margin-top:3px;}

/* ---------- order card ---------- */
.ord{background:#fff;border-radius:var(--radius);padding:13px 14px;margin-bottom:12px;}
.ord .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.ord .top .no{font-size:11.5px;color:var(--text-3);}
.ord .mid{display:flex;gap:11px;padding-bottom:11px;border-bottom:1px solid var(--line);}
.ord .mid .th{width:58px;height:58px;border-radius:9px;background:#F2F4F7;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#B4BAC1;}
.ord .mid .info h4{margin:0 0 5px;font-size:14px;font-weight:500;}
.ord .mid .info p{margin:0;font-size:12px;color:var(--text-3);line-height:1.6;}
.ord .bot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;font-size:12px;color:var(--text-3);}

.countdown{
  display:flex;align-items:center;gap:8px;background:var(--warn-light);border-radius:9px;
  padding:10px 12px;font-size:12.5px;color:var(--warn);margin-bottom:12px;
}
.countdown.urgent{background:var(--danger-light);color:var(--danger);}
.countdown.ok{background:var(--ok-light);color:var(--ok);}

.promise-box{background:var(--brand-light);border-radius:var(--radius);padding:14px;}
.promise-box .pi{display:flex;gap:9px;font-size:12.5px;color:var(--brand);line-height:1.6;margin-bottom:9px;}
.promise-box .pi:last-child{margin-bottom:0;}
.promise-box .pi svg{flex-shrink:0;margin-top:2px;}

/* ---------- 承运物流选择 ---------- */
.carrier-list{display:flex;flex-direction:column;gap:9px;}
.carrier-item{display:flex;align-items:center;gap:12px;border:1.5px solid #EDEFF2;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;background:#fff;}
.carrier-item:active{transform:scale(.99);}
.carrier-item .ci-radio{width:18px;height:18px;border-radius:50%;border:2px solid #C9CFD6;flex-shrink:0;position:relative;transition:all .15s;}
.carrier-item.on{border-color:var(--brand);background:var(--brand-light);}
.carrier-item.on .ci-radio{border-color:var(--brand);background:var(--brand);}
.carrier-item.on .ci-radio::after{content:'';position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.carrier-item .ci-info{flex:1;min-width:0;}
.carrier-item .ci-name{font-size:13.5px;font-weight:500;color:var(--text-1);}
.carrier-item .ci-desc{font-size:11.5px;color:var(--text-3);margin-top:2px;}
.carrier-item .ci-badge{flex-shrink:0;font-size:11px;color:var(--brand);background:#fff;border:1px solid var(--brand-line);border-radius:20px;padding:3px 9px;}
.carrier-item.on .ci-badge{background:var(--brand);color:#fff;border-color:var(--brand);}

/* ---------- address ---------- */
.addr{background:#fff;border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;position:relative;}
.addr .nm{font-size:14px;font-weight:500;margin-bottom:5px;}
.addr .nm span{font-size:12.5px;font-weight:400;color:var(--text-2);margin-left:8px;}
.addr .ad{font-size:12.5px;color:var(--text-2);line-height:1.6;padding-right:44px;}
.addr .ops{position:absolute;right:12px;bottom:11px;display:flex;gap:12px;font-size:12px;color:var(--text-3);}
.addr .ops span{cursor:pointer;}
.addr .ops span:hover{color:var(--brand);}
.switch{width:44px;height:25px;border-radius:13px;background:#DFE3E8;position:relative;flex-shrink:0;cursor:pointer;transition:background .18s;}
.switch.on{background:var(--brand);}
.switch::after{content:"";position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.14);}
.switch.on::after{transform:translateX(19px);}

/* ---------- mine ---------- */
.mine-hd{background:#fff;padding:20px 16px;display:flex;align-items:center;gap:13px;}
.mine-hd .av{width:54px;height:54px;border-radius:50%;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;}
.mine-hd .tx h3{margin:0 0 4px;font-size:16px;font-weight:500;}
.mine-hd .tx p{margin:0;font-size:12px;color:var(--text-3);}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;}
.list-item:last-child{border-bottom:none;}
.list-item .li-l{display:flex;align-items:center;gap:10px;}
.list-item .arw{color:#C8CDD3;font-size:13px;}
.list-item:active{background:#FAFBFC;}

/* ---------- toast ---------- */
.toast{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.96);
  background:rgba(28,32,38,.86);color:#fff;font-size:13px;padding:11px 18px;border-radius:9px;
  max-width:250px;text-align:center;line-height:1.55;opacity:0;pointer-events:none;transition:all .2s;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

.footbar{
  position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 14px;
  display:flex;gap:10px;align-items:center;
}
.footbar .fb-l{flex:1;font-size:12px;color:var(--text-3);line-height:1.5;}
.footbar .btn{width:auto;padding:12px 26px;flex-shrink:0;}

.center{padding:60px 30px;text-align:center;}
.center .i{width:60px;height:60px;border-radius:50%;background:var(--ok-light);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.center h3{margin:0 0 8px;font-size:17px;font-weight:500;}
.center p{margin:0 0 22px;font-size:13px;color:var(--text-3);line-height:1.7;}
.center .acts{display:flex;gap:10px;justify-content:center;}
.center .acts .btn{width:auto;padding:11px 24px;}
</style>
</head>

<script>
/* =========================================================
   数据层（演示用 mock，实际由后端接口提供）
   ========================================================= */
const DAY = 86400000;
const now = () => Date.now();
const fmt = (ts) => {
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

const STORE_KEY = 'hz_delivery_demo_v3';
/* 部分浏览器（如以 file:// 打开时的 Chrome）会禁用 localStorage，
   这里做一层降级：不可用时退回内存存储，保证页面依然可用 */
const store = (() => {
  let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); }
  catch (e) { ok = false; }
  const mem = {};
  return {
    available: ok,
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k, v){ try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch(e){ mem[k] = v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){ delete mem[k]; } }
  };
})();
let S = load();

function freshState(){
  const s = JSON.parse(JSON.stringify(SEED));
  s.logged = false;
  s.grantee.used = 0;
  return s;
}
function load(){
  const base = freshState();
  try{
    const raw = store.get(STORE_KEY);
    if(!raw) return base;
    const d = JSON.parse(raw);
    return Object.assign(base, {
      logged: !!d.logged,
      addresses: d.addresses || base.addresses,
      orders: d.orders || base.orders,
      packages: d.packages || base.packages,
      grantee: Object.assign(base.grantee, {used: d.granteeUsed || 0})
    });
  }catch(e){
    return base;
  }
}
function save(){
  // 只持久化用户态数据
  store.set(STORE_KEY, JSON.stringify({
    logged: S.logged, granteeUsed: S.grantee.used,
    addresses: S.addresses, orders: S.orders, packages: S.packages
  }));
}

/* =========================================================
   后端接口适配层
   同源部署走相对路径；直接以 file:// 打开时指向本地后端
   ========================================================= */
/* 接口地址候选：
   1. 与页面同源（经 Nginx 部署的标准入口）
   2. http://localhost/api（file:// 打开、或从静态预览面板打开时的兜底）
   首个请求若遇到「网络失败 / 返回的不是接口 JSON」会自动切到下一个候选并记住。 */
const API_CANDIDATES = (function(){
  const list = [];
  if(location.protocol === 'file:') list.push('http://localhost/api');
  else list.push(location.origin + '/api');
  if(list.indexOf('http://localhost/api') < 0) list.push('http://localhost/api');
  return list;
})();
const TOKEN_KEY = 'hz_client_token';

const API = {
  token: null,
  base: null,          // 已探测出的可用接口地址
  restore(){
    try { this.token = localStorage.getItem(TOKEN_KEY) || null; } catch(e) { this.token = null; }
  },
  setToken(t){
    this.token = t || null;
    try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch(e) {}
  },
  bases(){
    const list = API_CANDIDATES.slice();
    if(this.base && list[0] !== this.base){
      const i = list.indexOf(this.base);
      if(i > 0){ list.splice(i, 1); }
      list.unshift(this.base);
    }
    return list;
  },
  async req(method, path, body){
    let offlineErr = null;
    for(const base of this.bases()){
      const opt = { method, headers: {} };
      if(this.token) opt.headers['X-Token'] = this.token;
      if(body !== undefined){
        opt.headers['Content-Type'] = 'application/json';
        opt.body = JSON.stringify(body);
      }
      let resp;
      try {
        resp = await fetch(base + path, opt);
      } catch(e) {
        offlineErr = new Error('无法连接服务端，请通过 http://localhost/ 访问并确认服务已启动');
        offlineErr.offline = true;
        continue;                       // 网络失败，换下一个候选地址
      }
      let data;
      try { data = await resp.json(); }
      catch(e) {
        // 返回的不是接口 JSON（如静态预览面板的 404/HTML 页），视作地址不可用
        offlineErr = new Error('无法连接服务端，请通过 http://localhost/ 访问并确认服务已启动');
        offlineErr.offline = true;
        continue;
      }
      this.base = base;
      if(!data || data.code !== 0){
        const err = new Error((data && data.msg) || ('请求失败（HTTP ' + resp.status + '）'));
        err.code = data && data.code;
        throw err;
      }
      return data.data;
    }
    throw offlineErr || new Error('无法连接服务端，请通过 http://localhost/ 访问并确认服务已启动');
  },
  get(p){ return this.req('GET', p); },
  post(p, b){ return this.req('POST', p, b === undefined ? {} : b); },
  del(p){ return this.req('DELETE', p); }
};
API.restore();

/* 后端时间字符串 -> 毫秒时间戳（iOS 不识别 yyyy-MM-dd HH:mm:ss，需换分隔符） */
/* 后端时间字符串 -> 毫秒时间戳。
   后端返回 ISO-8601（2026-09-01T11:20:04），iOS Safari 与部分浏览器
   不识别这种格式，需先归一化为 yyyy/MM/dd HH:mm:ss；带时区后缀的串走原生解析兜底 */
function ts(v){
  if(!v) return null;
  const t = new Date(String(v).replace(/-/g, '/').replace('T', ' ')).getTime();
  if(!isNaN(t)) return t;
  const n = new Date(String(v)).getTime();
  return isNaN(n) ? null : n;
}

function normOrder(o){
  if(!o) return o;
  ['createTime','slaDeadline','shipTime','signTime','cancelTime'].forEach(function(k){ o[k] = ts(o[k]); });
  /* 轨迹字段统一：后端返回 {description, trackTime}，演示数据用 {desc, time}。
     渲染层统一读 t.desc / t.time，两种来源都补齐别名，避免出现 NaN-NaN-NaN。 */
  (o.traces || []).forEach(function(t){
    t.trackTime = ts(t.trackTime != null ? t.trackTime : t.time);
    t.time = t.trackTime;
    t.description = (t.description != null ? t.description : t.desc) || '';
    t.desc = t.description;
  });
  if(o.slaDeadline) o.remainDays = Math.ceil((o.slaDeadline - now()) / DAY);
  return o;
}
function normGrantee(g){
  return {empNo:g.empNo, name:g.name, phone:g.phone, org:g.org, dept:g.dept, quota:g.quota, used:g.used};
}

    </div>
  </div>`;

async function sendCode(){
  if(S.loginMode !== 'sms'){ loginErr = '当前登录方式无需短信验证码'; render(); return; }
  const p = (document.getElementById('phone').value||'').trim();
  if(!/^1\d{10}$/.test(p)){ loginErr='请输入正确的 11 位手机号'; loginPhone=p; render(); return; }
  loginPhone = p;
  const btn = document.getElementById('codeBtn');
  btn.disabled = true; btn.textContent = '发送中...';
  try{
    const r = await API.post('/client/auth/send-code?phone=' + encodeURIComponent(p));
    let s = 60;
    btn.textContent = `${s}s 后重发`;
    const t = setInterval(()=>{
      s--; if(s<=0){ clearInterval(t); btn.disabled=false; btn.textContent='获取验证码'; }
      else btn.textContent = `${s}s 后重发`;
    },1000);
    loginErr = '';
    toast(r && r.mockCode ? `验证码已发送，演示验证码：${r.mockCode}` : '验证码已发送，请查收短信');
  }catch(e){
    // 名单外手机号等业务错误：直接提示，不进入倒计时
    loginErr = e.message;
    render();
  }
}
async function doLogin(){
  const p = (document.getElementById('phone').value||'').trim();
  loginPhone = p;
  if(!/^1\d{10}$/.test(p)){ loginErr='请输入正确的 11 位手机号'; render(); return; }

  let body;
  if(S.loginMode === 'sms'){
    const c = (document.getElementById('code').value||'').trim();
    loginCode = c;
    if(!/^\d{6}$/.test(c)){ loginErr='请输入 6 位数字验证码'; render(); return; }
    body = {phone:p, code:c};
  }else{
    const n = (document.getElementById('loginName').value||'').trim();
    loginName = n;
    if(n.length < 2){ loginErr='请输入本人姓名（须与单位登记一致）'; render(); return; }
    body = {phone:p, name:n};
  }

  loginErr = '';
  try{
    const r = await API.post('/client/auth/login', body);
    API.setToken(r.token);
    S.grantee = normGrantee(r);
    S.logged = true;
    await loadAll();
    toast('身份核验通过');
    jump('#/home');
  }catch(e){
    loginErr = e.message;
    render();
  }
}

function changeQty(d){
  const id = route.params.id;

  detailQty = Math.max(1, Math.min(max, detailQty + d));
  render();
}

/* 注意：切换地区或开关时，先把已输入的文本收回 formAddr，避免重渲染丢输入 */
function onProvince(v){ collectForm(); formAddr.province=v; formAddr.city=''; formAddr.district=''; render(); }
function onCity(v){ collectForm(); formAddr.city=v; formAddr.district=''; render(); }
function onDistrict(v){ collectForm(); formAddr.district=v; render(); }
function toggleStation(){ collectForm(); formAddr.allowStation = !formAddr.allowStation; render(); }
/* 选择期望承运物流（包邮，合作物流中自选） */
function pickCarrier(code){ collectForm(); formAddr.carrier = code; render(); }

function collectForm(){
  const g = id => (document.getElementById(id)?.value || '').trim();
  if(!document.getElementById('f_name')) return;   // 未处于表单页时不动数据
  formAddr.name = g('f_name'); formAddr.phone = g('f_phone');
  formAddr.detail = g('f_detail'); formAddr.remark = g('f_remark');
  const pv = document.getElementById('f_province'), ct = document.getElementById('f_city'), dt = document.getElementById('f_district');
  if(pv && pv.value) formAddr.province = pv.value;
  if(ct && ct.value) formAddr.city = ct.value;
  if(dt && dt.value) formAddr.district = dt.value;
}
/* 地址完整度校验：对应招标要求「快递上楼到家入户」 */
function validateAddress(addr){
  if(!addr.name) return '请填写收货人姓名';
  if(!/^1\d{10}$/.test(addr.phone)) return '请填写正确的 11 位手机号';
  if(!addr.province || !addr.city || !addr.district) return '请选择完整的省 / 市 / 区信息';
  const d = addr.detail.replace(/\s/g,'');
  if(!d) return '请填写详细地址';
  if(d.length < 8) return '详细地址太短，请补充到楼栋与门牌号，例：五四东路180号3栋502室';
  if(!/\d/.test(d)) return '详细地址缺少门牌号，请补充数字门牌，以免快递无法上门';
  if(!/(室|栋|幢|号楼|单元|号|巷|组|村|大厦|公寓|小区|组团|座)/.test(d))
    return '详细地址缺少楼栋/门牌信息，请补充「X栋X单元XXX室」等内容';
  return '';
}
async function submitOrder(){
  collectForm();
  const err = validateAddress(formAddr);
  if(err){ formErr = err; render(); toast(err); return; }
  formErr = '';
  if(!pending){ toast('请先选择套餐'); jump('#/packages'); return; }

  const btn = document.getElementById('submitOrderBtn');
  if(btn){ btn.disabled = true; btn.textContent = '提交中...'; }

  const editingId = pending.editingOrder;   // 有值 = 从订单详情进来的「修改地址」
  try{
    // 修改地址走更新分支：后端限制仅「待发货」可改、仅 1 次，并写入物流轨迹留痕
    if(editingId){
      await API.post('/client/orders/' + editingId + '/address', {
        receiver: formAddr.name,
        phone: formAddr.phone,
        province: formAddr.province,
        city: formAddr.city,
        district: formAddr.district,
        detail: formAddr.detail,
        allowStation: !!formAddr.allowStation,
        remark: formAddr.remark || ''
      });
      await loadAll();
      pending = null;
      formAddr = {name:'',phone:'',province:'',city:'',district:'',detail:'',allowStation:false,remark:'',carrier:''};
      jump('#/order/' + editingId);
      setTimeout(()=>toast('收货地址已修改，发货时将按新地址配送'), 260);
      return;
    }

    // 库存校验、额度扣减、每人限领 1 份，全部由服务端在事务内完成
    const order = await API.post('/client/orders', {
      packageId: pending.packageId,
      quantity: pending.quantity || 1,
      receiver: formAddr.name,
      phone: formAddr.phone,
      province: formAddr.province,
      city: formAddr.city,
      district: formAddr.district,
      detail: formAddr.detail,
      allowStation: !!formAddr.allowStation,
      carrierCode: formAddr.carrier || undefined,
      remark: formAddr.remark || '',
      saveAddress: true
    });
    await loadAll();
    pending = null;

const TITLE_MAP = {
  login:'', home:'华中商贸配送中心', packages:'选择慰问品套餐', package:'套餐详情',
  confirm:'填写配送信息', result:'提交成功', orders:'我的订单', order:'订单详情', track:'物流查询',
  address:'收货地址簿', notice:'配送说明', mine:'我的'
};

/* 订单列表接口不返回轨迹明细，进入订单详情页时按需拉取一次（每个订单只拉一次） */
const tracesInflight = new Map();
function ensureTraces(orderId){
  const key = String(orderId);
  const o = S.orders.find(x=>String(x.id)===key);
  if(!o || (o.traces && o.traces.length)) return Promise.resolve(o);
  if(tracesInflight.has(key)) return tracesInflight.get(key);
  const p = API.get('/client/orders/' + key).then(function(full){
    full = normOrder(full || {});
    o.traces      = full.traces || [];
    o.carrier     = full.carrier     || o.carrier;
    o.carrierName = full.carrierName || o.carrierName;
    o.waybillNo   = full.waybillNo   || o.waybillNo;
    tracesInflight.delete(key);
    if(route.name === 'order') render();
    return o;
  }).catch(function(){
    o.traces = o.traces || [];
    tracesInflight.delete(key);
    if(route.name === 'order') render();
    return o;
  });
  tracesInflight.set(key, p);
  return p;
}

function render(){
  route = parseHash();
  const {name, params} = route;
  if(name!=='login' && !S.logged){
    location.hash = '#/login';
    return;
  }

  let html = '';
  switch(name){
    case 'login': html = pageLogin(); break;
    case 'home': html = pageHome(); break;
    case 'packages': html = pagePackages(); break;
    case 'package': html = pagePackageDetail(params.id); break;
    case 'confirm': html = pageConfirm(); break;
    case 'result': html = pageResult(params.id); break;
    case 'orders': html = pageOrders(); break;
    case 'track': html = pageTrack(); break;
    case 'order': html = pageOrderDetail(params.id); break;
    case 'address': html = pageAddress(); break;
    case 'notice': html = pageNotice(); break;
    case 'mine': html = pageMine(); break;
    default: html = pageHome();
  }

  document.getElementById('screen').innerHTML = html;
  document.getElementById('screen').scrollTop = 0;

  // 详情页轨迹按需加载（列表接口不含 traces）
  if(name === 'order' && params.id) ensureTraces(params.id);

  // 导航栏
  const title = TITLE_MAP[name] || '';
  const showBack = !['login','home','packages','orders','mine'].includes(name);
  document.getElementById('navbar').innerHTML = `
    ${showBack?`<div class="nav-back" onclick="history.back()">${IC.back}</div>`:''}
    <span>${esc(title)}</span>`;

  // 底部 tabbar：仅 4 个 tab 页显示，其余页面（详情/表单等）隐藏，与微信小程序行为一致
  const tb = document.getElementById('tabbar');
  const showTab = TAB_PAGES.includes(name);
  tb.style.display = showTab ? 'flex' : 'none';
  tb.innerHTML = showTab ? TAB_HTML(name) : '';
}
function TAB_HTML(active){
  return TABS.map(t=>`
    <div class="tab ${t.key===active?'on':''}" onclick="jump('${t.path}')">
      <svg viewBox="0 0 24 24">${t.icon}</svg>
      <span>${t.label}</span>
    </div>`).join('');
}

/* 启动：先向服务端确认登录方式（免短信 / 短信），再用本地 token 恢复会话，最后决定页面 */
route = parseHash();
const bootReady = (async function boot(){
  try{
    const m = await API.get('/client/auth/mode');
    if(m && m.mode){ S.loginMode = m.mode; S.loginModeInfo = m; }
  }catch(e){
    /* 接口不可达时保持默认登录方式，保证登录页仍能渲染（错误会在提交时提示） */
  }
  const ok = await tryRestoreSession();
  if(!ok){
    S.logged = false;
    if(location.hash !== '#/login'){ location.hash = '#/login'; }
  }
  render();
})();
</script>
